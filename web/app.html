        try{ const r = await api('/v1/radar', {session_id:S.sid, country:S.country, area: area.value.trim() || null, place, kind}, 20000); fill(box, h('p', {class:'fine', style:'color:var(--good);font-weight:600'}, icon('check'), t('warnThanks'))); onDone && onDone(r); }catch(e){}
      }}, icon('alert'), t('warnSend'))));
  };
  fill(box, h('button', {class:'warnbtn', type:'button', onclick: open}, icon('alert'), t('warnOthers')));
  return box;
}
function drawRadar(box, r){
  const places = (SCEN[S.lang] && SCEN[S.lang].places) || {};
  const rows = [];
  for (const [k, n] of Object.entries(r.by_kind || {}).sort((a, b) => b[1] - a[1])) rows.push(h('div', null, h('span', null, t('kinds')[k] || k), h('b', null, num(n))));
  for (const a of r.areas || []) rows.push(h('div', null, h('span', null, '📍 ' + a.area + ' · ' + (places[a.place] || a.place)), h('b', null, num(a.count))));
  fill(box, h('section', {class:'radar'}, h('h2', null, h('span', {class:'sweep'}), t('radarH')), h('p', null, t('radarSub')(num(r.days || 90))),
    r.total ? [h('div', null, h('span', {class:'big'}, num(r.total)), h('span', {style:'font-weight:600'}, t('radarWomen'))), h('div', {class:'rows'}, rows)] : h('p', {style:'margin:0;color:#F4EEE3'}, t('radarNone'))));
}

/* ============================================================== witness */
let unlocked = false;
async function sha(text){
  try{ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join(''); }
  catch(e){ let x = 5381; for (const c of text) x = ((x * 33) ^ c.charCodeAt(0)) >>> 0; return x.toString(16).padStart(8, '0').repeat(8); }
}
const sealOf = (prev, e) => sha([prev, e.ts, e.at, e.text].join('|'));
function Witness(){
  const root = h('div');
  if (!unlocked && store.get('pin', null)) lockScreen(root, 'enter');
  else if (!unlocked && !store.get('pinSkipped', false)) lockScreen(root, 'set');
  else diary(root);
  return root;
}
function lockScreen(root, mode){
  let code = '', first = null;
  const label = h('b', {style:'font-family:var(--f-display);font-size:21px;text-align:center'}, mode === 'set' ? t('pinSet') : t('pinEnter'));
  const dots = h('div', {class:'dotsrow'}, [0, 1, 2, 3].map(() => h('i')));
  const err = h('div', {class:'err', role:'alert'});
  const box = h('div', {class:'lock'});
  const paint = () => [...dots.children].forEach((d, i) => d.classList.toggle('on', i < code.length));
  async function press(k){
    if (k === '⌫'){ code = code.slice(0, -1); paint(); return; }
    if (code.length >= 4) return;
    code += k; paint();
    if (code.length < 4) return;
    const hash = await sha('herevo-pin:' + code);
    if (mode === 'enter'){
      if (hash === store.get('pin')){ unlocked = true; diary(root); }
      else { err.textContent = t('pinWrong'); box.classList.add('shake'); setTimeout(() => { box.classList.remove('shake'); code = ''; paint(); }, 450); }
    } else if (!first){ first = hash; code = ''; paint(); label.textContent = t('pinAgain'); }
    else if (first === hash){ store.set('pin', hash); unlocked = true; diary(root); }
    else { first = null; code = ''; paint(); label.textContent = t('pinSet'); err.textContent = t('pinMismatch'); }
  }
  fill(box, h('span', {class:'avatar', style:'background:var(--witness);width:64px;height:64px;border-radius:22px'}, icon('lock')), label, dots, err,
    h('div', {class:'pad'}, ['1','2','3','4','5','6','7','8','9','','0','⌫'].map((k) => k === '' ? h('span') : h('button', {type:'button', onclick: () => press(k)}, k === '⌫' ? '⌫' : num(k)))),
    mode === 'set' ? h('button', {class:'finish', type:'button', onclick: () => { store.set('pinSkipped', true); unlocked = true; diary(root); }}, t('skipPin')) : null);
  fill(root, h('h1', {class:'title'}, t('witnessH')), box);
}
async function diary(root){
  const entries = store.get('witness', []);
  const today = new Date().toISOString().slice(0, 10);
  const text = h('textarea', {placeholder: t('addPh')});
  const date = h('input', {type:'date', value: today, max: today});
  const micB = h('button', {class:'mic', type:'button', 'aria-label':'Mic', onclick: () => { const before = text.value ? text.value + ' ' : ''; hear(micB, (x) => { text.value = before + x; }); }}, icon('mic'));
  async function add(t0, at){
    const prev = entries.length ? entries[entries.length - 1].seal : 'genesis';
    const e = {ts: new Date().toISOString(), at, text: t0};
    e.seal = await sealOf(prev, e); entries.push(e); store.set('witness', entries);
  }
  const saveB = h('button', {class:'btn', type:'button', onclick: async () => { const v = text.value.trim(); if (!v) return; await add(v, date.value || today); diary(root); }}, icon('lock'), t('saveNote'));
  // verify the chain
  let prev = 'genesis', okAll = true; const ok = [];
  for (const e of entries){ const good = (await sealOf(prev, e)) === e.seal; ok.push(good); okAll = okAll && good; prev = e.seal; }
  const fmtDate = (d) => { try{ return new Date(d + 'T12:00:00').toLocaleDateString(S.lang === 'bn' ? 'bn-BD' : 'en-GB', {day:'numeric', month:'long', year:'numeric'}); }catch(e){ return d; } };
  const tl = entries.length ? h('ol', {class:'timeline'}, entries.map((e, i) => h('li', {style:`animation-delay:${i * 40}ms`},
      h('div', {class:'when'}, fmtDate(e.at)), h('p', null, e.text),
      h('span', {class:'wax' + (ok[i] ? '' : ' bad')}, h('i', null, icon(ok[i] ? 'lock' : 'alert')), t('sealed') + ' ' + e.seal.slice(0, 8).toUpperCase(), i ? h('span', {style:'opacity:.6;display:inline-flex'}, icon('link')) : null))).reverse())
    : h('p', {class:'empty'}, t('empty'));
  const delArea = h('div', {style:'text-align:center;margin-top:18px'});
  const askDelete = () => fill(delArea, h('p', {style:'margin:0 0 6px;font-weight:600'}, t('confirmDelete')), h('div', {class:'row', style:'justify-content:center'},
    h('button', {class:'btn', type:'button', style:'background:var(--danger)', onclick: () => { store.del('witness'); diary(root); }}, t('yesDelete')), h('button', {class:'btn ghost', type:'button', onclick: resetDel}, t('cancel'))));
  const resetDel = () => fill(delArea, entries.length ? h('button', {class:'danger-link', type:'button', onclick: askDelete}, t('deleteAll')) : null);
  resetDel();
  fill(root, 
    h('h1', {class:'title'}, t('witnessH')), h('p', {class:'sub'}, t('witnessSub')),
    entries.length ? h('div', {class:'seal ' + (okAll ? 'ok' : 'bad')}, icon(okAll ? 'check' : 'alert'), h('span', null, okAll ? t('sealOk')(num(entries.length)) : t('sealBad'))) : null,
    h('div', {class:'write'}, text, h('div', {class:'row'}, micB, date, saveB)),
    h('div', {style:'display:grid;gap:10px;margin-top:14px'},
      entries.length ? h('button', {class:'btn block', type:'button', style:'background:var(--witness)', onclick: () => makeStatement(entries)}, icon('book'), t('makeStatement')) : null,
      h('button', {class:'btn ghost block', type:'button', onclick: async () => { for (const [s0, days] of t('samples')){ const d = new Date(Date.now() + days * 864e5).toISOString().slice(0, 10); await add(s0, d); } diary(root); }}, t('addSample'))),
    entries.length ? h('p', {class:'fine'}, icon('lock'), t('sendNote')) : null,
    tl, delArea);
}
async function makeStatement(entries){
  const close = sheet(h('h2', null, t('statementH')), h('div', {class:'empty'}, h('span', {class:'spinner'})));
  try{
    const r = await api('/v1/statement', {session_id:S.sid, entries: entries.map((e) => ({at:e.at, text:e.text})), lang:S.lang, country:S.country}, 60000);
    const body = h('div', {class:'statement'}, r.statement);
    const copyB = h('button', {class:'btn', type:'button', onclick: async () => { try{ await navigator.clipboard.writeText(r.statement + (r.statement_en ? '\n\n' + r.statement_en : '')); toast(t('copied')); }catch(e){ const sel = getSelection(); const rg = document.createRange(); rg.selectNodeContents(body); sel.removeAllRanges(); sel.addRange(rg); } }}, icon('copy'), t('copy'));
    sheet(h('h2', null, t('statementH')), body,
      r.statement_en && S.lang !== 'en' ? h('details', {style:'margin-top:10px'}, h('summary', {style:'font-weight:600;min-height:44px;display:flex;align-items:center'}, t('english')), h('div', {class:'statement'}, r.statement_en)) : null,
      (r.missing || []).length ? [h('h2', {class:'section'}, t('missingH')), h('ul', {style:'margin:0;padding-left:20px;display:grid;gap:6px'}, r.missing.map((m) => h('li', null, m)))] : null,
      r.where ? [h('h2', {class:'section'}, t('whereH')), h('p', {style:'margin:0'}, r.where)] : null,
      h('div', {class:'row', style:'margin-top:18px'}, copyB, listenBtn(r.statement)));
  }catch(e){ close(); }
}

try{ if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('/sw.js'); }catch(e){}
try{ const a = localStorage.getItem('herevo.active'); if (a && profiles().some((p) => p.id === a)) PROFILE = a; }catch(e){}
try{ speechSynthesis.getVoices(); }catch(e){}
route();
firstVisitLanguage();
