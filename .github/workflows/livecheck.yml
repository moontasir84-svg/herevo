name: live-check

# Shows what the live server is actually serving: version of the page, headers, health. Run by hand.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          B=https://herevo.onrender.com
          echo "== /health"; curl -s --max-time 90 $B/health; echo
          echo "== / headers"; curl -sI --max-time 60 $B/ | grep -iE "^(HTTP|cache-control|last-modified|etag|x-render)" || true
          echo "== page version markers"
          curl -s --max-time 60 $B/ -o page.html
          echo "new send flow (bubble thinking): $(grep -c 'bubble thinking' page.html)"
          echo "deferred map: $(grep -c 'defer src' page.html)"
          echo "== /sw.js"; curl -s --max-time 60 $B/sw.js | grep -m1 "const CACHE"
          echo "== /v1/ask timing"
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 90 -H 'content-type: application/json' \
            -d '{"session_id":"livecheck-0001","text":"How do I save money?","country":"BD"}' $B/v1/ask
