name: tool-check

# Tries HerEvo's tools on the live server with the real AI: Paper Lens on the sample gift deed, one rehearsal
# turn, one whisper and one statement. Made-up data only. Run by hand.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://herevo.onrender.com
          curl -s --max-time 90 $B/health; echo
          echo "== / is the new app: $(curl -s --max-time 60 $B/ | grep -c 'Paper Lens')"
          echo "== /chat is the conversation: $(curl -s --max-time 60 $B/chat | grep -c 'askApi')"
          post() { curl -s --max-time 90 -w "\n[HTTP %{http_code} in %{time_total}s]\n" -H 'content-type: application/json' -d @"$2" "$B$1"; }
          python3 - <<'PY'
          import base64, json
          img = base64.b64encode(open("web/samples/heba.jpg","rb").read()).decode()
          json.dump({"session_id":"toolcheck-0001","image":img,"lang":"bn","country":"BD"}, open("lens.json","w"))
          json.dump({"session_id":"toolcheck-0001","image":base64.b64encode(open("web/samples/notice.jpg","rb").read()).decode(),"lang":"en","country":"BD"}, open("lens2.json","w"))
          json.dump({"session_id":"toolcheck-0001","scenario":"inlaw_land","lang":"bn","said":"আইনে স্ত্রী আট ভাগের এক ভাগ পান। আমার ভাগ সাড়ে বারো শতাংশ।","history":[]}, open("reh.json","w"))
          json.dump({"session_id":"toolcheck-0001","place":"land_office","lang":"en","heard":"Pay me five thousand taka or your mutation file will sit for six months."}, open("cnt.json","w"))
          json.dump({"session_id":"toolcheck-0001","lang":"en","entries":[{"at":"2026-11-02","text":"SAMPLE: He pushed me against the wall at night. My arm is bruised."},{"at":"2026-11-09","text":"SAMPLE: He took my phone and locked the door."}]}, open("st.json","w"))
          json.dump({"session_id":"toolcheck-0001","lang":"bn","country":"BD","text":"আমার স্বামী গত বছর মারা গেছেন। আমার দুই ছেলে আর এক মেয়ে। ৮০ শতাংশ জমি আছে। দেবর বলছে মেয়েমানুষ জমি পায় না, একটা কাগজে টিপসই দিতে বলছে।"}, open("plan.json","w"))
          json.dump({"session_id":"toolcheck-0001","lang":"en","country":"KE","text":"My husband died in March. His brothers say the shamba belongs to the clan and they want to sell it. I have three children."}, open("plan2.json","w"))
          PY
          echo "== lens (gift deed, Bangla)"; post /v1/lens lens.json
          echo "== lens (hearing notice, English)"; post /v1/lens lens2.json
          echo "== rehearse"; post /v1/rehearse reh.json
          echo "== counter"; post /v1/counter cnt.json
          echo "== statement"; post /v1/statement st.json
          echo "== plan (Bangla, land)"; post /v1/plan plan.json
          echo "== plan (Kenya, English)"; post /v1/plan plan2.json
          echo "== radar"; curl -s --max-time 60 $B/v1/radar/BD; echo
