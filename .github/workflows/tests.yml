name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: herevo
          POSTGRES_PASSWORD: herevo
          POSTGRES_DB: herevo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U herevo" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://herevo:herevo@localhost:5432/herevo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt -r ../mcp/requirements.txt
      - run: python -m pytest -q
      - name: Evaluation (offline mode, 54 questions)
        env:
          DATABASE_URL: postgresql://herevo:herevo@localhost:5432/herevo_test
          PACKS_DIR: ${{ github.workspace }}/data/packs
        run: python scripts/run_eval.py ../eval/bd_questions.yaml
