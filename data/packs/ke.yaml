    en: "Hello! I am HerEvo. Write or say your question about work, money, rights or safety."
  welcome:
    sw: "Habari, mimi ni HerEvo. Uliza swali lolote kuhusu kazi, pesa, afya, haki au usalama, kwa Kiswahili au Kiingereza. Hatuhifadhi jina wala nambari yako ya simu. Ukikubali, andika 'ndiyo' (au 'yes')."
    en: "Hello, I am HerEvo. Ask any question about work, money, health, rights or safety, in Swahili or English. We do not store your name or phone number. If you agree, type 'yes'."
