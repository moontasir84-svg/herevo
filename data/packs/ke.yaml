  sent_to_helper:
    sw: "Ujumbe wako umetumwa kwa mhudumu wako, atakujibu hapa. Ukiwa hatarini sasa, piga 999 au 112."
    en: "Your message has been sent to your helper, who will answer here. If you are in danger now, call 999 or 112."
