    bn: "আসসালামু আলাইকুম, আমি HerEvo। জমি, ফসল, আয়, অধিকার বা নিরাপত্তা নিয়ে যেকোনো প্রশ্ন বাংলায় লিখুন বা বলুন। আপনার নাম বা ফোন নম্বর আমরা সংরক্ষণ করি না। চালিয়ে যেতে 'হ্যাঁ' লিখুন।"
