# Render blueprint: New > Blueprint > pick this repo. Secrets are entered in the Render dashboard.
services:
  - type: web
    name: herevo-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # Phase 1 (free): DATA_MODE=test with Gemini. Phase 2 (pilot): DATA_MODE=live, LLM_PROVIDER=claude,
      # SPEECH_PROVIDER=google. The server refuses to start if live mode uses a free-tier provider.
      - key: DATA_MODE
        value: test
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SPEECH_PROVIDER
        value: gemini
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: EMBEDDINGS_PROVIDER
        value: hash
      - key: VOYAGE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: HELPER_CHAT_ID
        sync: false
      - key: ID_SALT
        generateValue: true
      - key: DEFAULT_COUNTRY
        value: BD
